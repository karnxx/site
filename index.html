function randsong() {
      const song = songs[Math.floor(Math.random() * songs.length)];
      document.getElementById("title").textContent = song.title;
      document.getElementById("artist").textContent = song.artist;
      document.getElementById("lyrics").textContent = "lyrarca";
      lyricfinder();
    }

let lyreq;

async function lyricfinder() {
    if (lyreq) {
        lyreq.abort();
    }

    const contr = new AbortController();
    lyreq = contr;
    const timid = setTimeout(() => contr.abort(), 12000);
    const title = document.getElementById("title").textContent;
    const artist = document.getElementById("artist").textContent.split(",")[0];
    const lyrara = document.getElementById("lyrics");

    lyrara.textContent = "loading loading loading loading i think u get it like its uh loading";
    try {
        const response = await fetch(`https://api.lyrics.ovh/v1/${encodeURIComponent(artist)}/${encodeURIComponent(title)}`, {
            signal: contr.signal
        });
        if (lyreq !== contr) {
            return;
        }
        if (!response.ok) {
            lyrara.textContent = "nu uh no lyrics so what abt the girl in the drop top top top top top";
            return;
        }
        const data = await response.json();
        if (lyreq === contr) {
            lyrara.textContent = data.lyrics || "nu uh no lyrics so what abt the girl in the drop top top top top top";
        }
    } catch (error) {
        if (lyreq !== contr) {
            return;
        }
        lyrara.textContent = contr.signal.aborted
            ? "timed out :///// ig ive never ever felt like"
            : "no lyrics bruh some wifi";
    } finally {
        clearTimeout(timid);
        if (lyreq === contr) {
            lyreq = undefined;
        }
    }
}
